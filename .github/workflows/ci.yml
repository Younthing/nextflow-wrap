name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Install Nextflow
        run: bash scripts/install-nextflow.sh
      - name: Install Jupyter kernel
        run: python3 -m pip install --user --break-system-packages ipykernel matplotlib
      - run: pnpm test
        env:
          NXF_DISABLE_CHECK_LATEST: "true"
          NXF_ANSI_LOG: "false"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:storybook
      - run: pnpm build
      - run: pnpm build-storybook --quiet

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Nextflow
        run: bash scripts/install-nextflow.sh
      - name: Install Jupyter kernel and R
        run: |
          python3 -m pip install --user --break-system-packages ipykernel matplotlib
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y r-base-core
      - name: Toolchain
        run: |
          java -version
          nextflow -version
          python3 --version
          python3 -c "import ipykernel, jupyter_client; print('ipykernel', ipykernel.__version__, 'jupyter_client', jupyter_client.__version__)"
          Rscript --version
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:real
      - run: pnpm test:e2e
        env:
          NXF_DISABLE_CHECK_LATEST: "true"
          NXF_ANSI_LOG: "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-user-path
          path: |
            playwright-report
            test-results
            e2e-artifacts
          if-no-files-found: ignore
