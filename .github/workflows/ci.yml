name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Install Nextflow
        env:
          NXF_VER: "26.10.4"
          NXF_DISABLE_CHECK_LATEST: "true"
          NXF_ANSI_LOG: "false"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nextflow" https://github.com/nextflow-io/nextflow/releases/download/v26.10.4/nextflow
          sudo install -m 755 "$RUNNER_TEMP/nextflow" /usr/local/bin/nextflow
          nextflow -version
      - run: pnpm test
        env:
          NXF_DISABLE_CHECK_LATEST: "true"
          NXF_ANSI_LOG: "false"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:storybook
      - run: pnpm build
      - run: pnpm build-storybook --quiet
