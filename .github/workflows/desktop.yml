name: Desktop

# Pull requests that touch the desktop shell build an unsigned Linux app and run the packaged-app e2e.
# A `desktop-v*` tag builds, signs and notarizes the macOS app (when the secrets are set) and publishes
# every platform to a GitHub release, which electron-updater reads for auto-update.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "e2e-desktop/**"
      - "src/features/desktop/**"
      - "src/lib/server/**"
      - "scripts/runner.ts"
      - "next.config.ts"
      - ".github/workflows/desktop.yml"
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packaged-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: pnpm --dir desktop typecheck
      - name: Install Nextflow
        run: bash scripts/install-nextflow.sh
      - name: Install Jupyter kernel
        run: python3 -m pip install --user --break-system-packages ipykernel matplotlib
      - name: Build the Linux app (unsigned)
        run: pnpm --dir desktop dist:linux
      - run: pnpm exec playwright install --with-deps chromium
      - name: Packaged-app e2e
        run: xvfb-run --auto-servernum pnpm exec playwright test -c e2e-desktop/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e
          path: |
            playwright-report-desktop
            test-results
            e2e-artifacts
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: packaged-e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir desktop install --frozen-lockfile
      - name: Install Nextflow (prefetches nf-weblog into the bundle)
        run: bash scripts/install-nextflow.sh
      - name: Check the tag matches desktop/package.json
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          test "desktop-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != desktop-v${version}"; exit 1; }
      - name: Build, sign, notarize and publish
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing: a Developer ID Application certificate exported as .p12, base64-encoded.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # Notarization with an app-specific password.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Without a certificate electron-builder builds an unsigned app instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
        run: node scripts/bundle.mjs && pnpm exec electron-builder ${{ matrix.target }} --publish always
