<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Nextflow Studio</title>
<!--
  The start page, bundled with the shell. Three views, picked by the main process (connect:state):
    splash   the backend is starting (status lines from connect:status)
    recover  starting failed: the error, retry, reinstall (rebuild in a development shell), another backend
    pick     no backend yet (Windows without WSL), or "another backend" from recover
  Colors follow src/app/globals.css.
-->
<style>
  :root {
    --bg: oklch(0.975 0.008 250); --text: oklch(0.22 0.03 260); --muted: oklch(0.5 0.03 260);
    --border: oklch(0.22 0.03 260 / 0.1); --panel: oklch(1 0 0 / 0.6); --field: oklch(1 0 0 / 0.8);
    --hover: oklch(0.22 0.03 260 / 0.05); --primary: oklch(0.58 0.19 262); --primary-text: oklch(0.985 0 0);
    --primary-soft: oklch(0.58 0.19 262 / 0.1); --danger: oklch(0.6 0.22 25); --danger-soft: oklch(0.6 0.22 25 / 0.08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(0.17 0.025 265); --text: oklch(0.95 0.01 255); --muted: oklch(0.7 0.025 260);
      --border: oklch(1 0 0 / 0.1); --panel: oklch(0.25 0.03 265 / 0.5); --field: oklch(0.2 0.03 265 / 0.8);
      --hover: oklch(1 0 0 / 0.05); --primary: oklch(0.68 0.17 258); --primary-text: oklch(0.16 0.03 265);
      --primary-soft: oklch(0.68 0.17 258 / 0.14); --danger: oklch(0.7 0.18 25); --danger-soft: oklch(0.65 0.2 25 / 0.12);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 14px/1.55 "Noto Sans SC", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .mono { font-family: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .logo { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--primary);
    color: var(--primary-text); font: 700 18px "JetBrains Mono", ui-monospace, monospace; }
  h1 { margin: 0; font: 700 22px/1.3 "Noto Serif SC", "Source Han Serif SC", Georgia, serif; }
  h2 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 500; }
  [hidden] { display: none !important; }

  /* splash */
  #splash { display: grid; justify-items: center; gap: 18px; text-align: center; width: min(420px, calc(100vw - 32px)); }
  #splash .target { color: var(--muted); font-size: 13px; }
  .bar { width: 180px; height: 3px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: var(--primary); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: .5; } }
  #status { min-height: 20px; font-size: 12px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* recover and pick */
  .card { width: min(560px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 28px; }
  .card header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .card header .logo { width: 40px; height: 40px; border-radius: 12px; font-size: 15px; }
  .card header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .error { margin: 0 0 18px; padding: 12px 14px; border-radius: 12px; background: var(--danger-soft); color: var(--danger);
    font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; font-size: 13px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--field);
    color: var(--text); padding: 0 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { background: var(--primary); border-color: transparent; color: var(--primary-text); }
  button.primary:hover:not(:disabled) { background: var(--primary); filter: brightness(1.07); }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  button.link { border: 0; background: none; padding: 0; height: auto; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  button:focus-visible, input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  section + section { margin-top: 22px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  li { display: flex; align-items: center; gap: 10px; border-radius: 10px; padding: 8px 10px; }
  li:hover { background: var(--hover); }
  li .name { flex: 1; min-width: 0; }
  li .name span { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 11px; margin-bottom: 14px; }
  .tabs button { border: 0; background: transparent; height: 28px; padding: 0 14px; border-radius: 8px; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--primary-soft); color: var(--text); font-weight: 600; }
  form { display: grid; gap: 12px; }
  label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
  input, select { font: 13px "JetBrains Mono", ui-monospace, monospace; height: 34px; padding: 0 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--field); color: var(--text); width: 100%; }
  .grid2 { display: grid; grid-template-columns: 1fr 96px; gap: 10px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .inline { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .inline span { flex: 1; }
  #pick-status { min-height: 18px; margin: 14px 0 0; font-size: 13px; color: var(--muted); white-space: pre-wrap; }
  #pick-status.error { color: var(--danger); }
</style>
</head>
<body>

<div id="splash" hidden role="status" aria-live="polite">
  <div class="logo" aria-hidden="true">nf</div>
  <h1>Nextflow Studio</h1>
  <div class="target" id="splash-target"></div>
  <div class="bar" aria-hidden="true"></div>
  <div id="status" class="mono"></div>
</div>

<main id="recover" class="card" hidden>
  <header>
    <div class="logo" aria-hidden="true">nf</div>
    <div><h1 style="font-size:18px">后端没有启动</h1><p id="recover-target"></p></div>
  </header>
  <p class="error" id="recover-error"></p>
  <div class="row-actions">
    <button class="primary" type="button" id="retry">重试</button>
    <button type="button" id="reinstall">重新安装服务端</button>
    <button class="ghost" type="button" id="to-pick">换一个后端</button>
  </div>
</main>

<main id="pick" class="card" hidden>
  <header>
    <div class="logo" aria-hidden="true">nf</div>
    <div><h1 style="font-size:18px">选择后端</h1><p>服务端运行的地方：WSL、远程机器或已有的地址</p></div>
  </header>

  <section id="saved-section" hidden>
    <h2>已保存</h2>
    <ul id="saved" aria-label="已保存的后端"></ul>
  </section>

  <section>
    <h2>新建</h2>
    <div class="tabs" role="tablist" id="tabs"></div>
    <form id="form" autocomplete="off">
      <div data-kind="local"></div>
      <div data-kind="wsl">
        <label id="distro-field">发行版<select name="distro" required></select></label>
        <div id="wsl-missing" class="inline" hidden>
          <span>没有可用的 WSL 发行版</span>
          <button type="button" id="install-wsl">安装 WSL</button>
          <button type="button" id="refresh-wsl" class="ghost">刷新</button>
        </div>
      </div>
      <div data-kind="ssh">
        <div class="grid2">
          <label>目标<input name="target" placeholder="user@server 或 ~/.ssh/config 别名" required></label>
          <label>端口<input name="port" inputmode="numeric" placeholder="22"></label>
        </div>
        <label>私钥（可选）<input name="identityFile" placeholder="~/.ssh/id_ed25519"></label>
      </div>
      <div data-kind="url">
        <label>地址<input name="url" placeholder="http://127.0.0.1:8765" required></label>
        <label>令牌<input name="token" type="password" required></label>
      </div>
      <div class="form-actions">
        <button class="ghost" type="button" id="back" hidden>返回</button>
        <button class="primary" type="submit" id="submit">连接</button>
      </div>
    </form>
  </section>
  <p id="pick-status" role="status" aria-live="polite"></p>
</main>

<script>
  const api = window.studioConnect;
  const KINDS = { local: "本机", wsl: "WSL", ssh: "SSH", url: "地址" };
  const DETAIL = { local: () => "这台电脑", wsl: (c) => `WSL · ${c.distro}`, ssh: (c) => `ssh ${c.target}${c.port ? `:${c.port}` : ""}`, url: (c) => c.url };
  const $ = (id) => document.getElementById(id);
  const form = $("form");
  let kind = "local";
  let state;

  function show(view) {
    for (const id of ["splash", "recover", "pick"]) $(id).hidden = id !== view;
  }

  function setPickStatus(message, error = false) {
    $("pick-status").textContent = message;
    $("pick-status").className = error ? "error" : "";
  }

  function showKind(next) {
    kind = next;
    for (const tab of $("tabs").children) tab.setAttribute("aria-selected", String(tab.dataset.kind === next));
    for (const part of form.querySelectorAll("[data-kind]")) {
      part.hidden = part.dataset.kind !== next;
      for (const field of part.querySelectorAll("input, select")) field.disabled = part.hidden;
    }
    $("submit").hidden = false;
    if (next === "wsl") loadDistros();
  }

  async function loadDistros(force = false) {
    const select = form.elements.distro;
    if (select.options.length && !force) return;
    select.replaceChildren();
    const distros = await api.distros();
    for (const name of distros) select.add(new Option(name, name));
    $("wsl-missing").hidden = distros.length > 0;
    $("distro-field").hidden = distros.length === 0;
    $("submit").hidden = kind === "wsl" && distros.length === 0;
  }

  $("refresh-wsl").onclick = async () => { setPickStatus(""); await loadDistros(true); };
  $("install-wsl").onclick = async () => {
    $("install-wsl").disabled = true;
    setPickStatus("正在安装 WSL…");
    const result = await api.installWsl();
    $("install-wsl").disabled = false;
    setPickStatus(result.ok ? "按安装窗口的提示创建 Linux 用户。需要重启时，重启后再打开应用。" : result.error, !result.ok);
    if (result.ok) await loadDistros(true);
  };

  async function connect(connection, token) {
    const result = await api.connect(connection, token);
    if (!result.ok) setPickStatus(result.error, true);
  }

  function renderSaved() {
    const list = $("saved");
    list.replaceChildren();
    $("saved-section").hidden = state.connections.length === 0;
    for (const connection of state.connections) {
      const item = document.createElement("li");
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = connection.label;
      const detail = DETAIL[connection.kind](connection);
      if (detail !== connection.label) {
        const line = document.createElement("span");
        line.className = "mono";
        line.textContent = detail;
        name.append(line);
      }
      const open = document.createElement("button");
      open.type = "button";
      open.textContent = "连接";
      open.onclick = () => connect(connection);
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "ghost";
      remove.textContent = "移除";
      remove.setAttribute("aria-label", `移除 ${connection.label}`);
      remove.onclick = async () => { state = { ...state, ...(await api.remove(connection.id)) }; renderSaved(); };
      item.append(name, open, remove);
      list.append(item);
    }
  }

  function showPick(fromRecover) {
    show("pick");
    $("back").hidden = !fromRecover;
    renderSaved();
    const kinds = Object.keys(KINDS).filter((k) => k !== "local" || state.localAvailable).filter((k) => k !== "wsl" || state.platform === "win32");
    if (!$("tabs").children.length) {
      for (const k of kinds) {
        const tab = document.createElement("button");
        tab.type = "button";
        tab.role = "tab";
        tab.dataset.kind = k;
        tab.textContent = KINDS[k];
        tab.onclick = () => showKind(k);
        $("tabs").append(tab);
      }
    }
    showKind(kinds[0]);
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    const connection = { id: `${kind}-${Date.now().toString(36)}`, kind, ...data };
    delete connection.token;
    connect(connection, kind === "url" ? data.token : undefined);
  });

  $("retry").onclick = () => api.retry({});
  $("reinstall").onclick = () => api.retry({ reinstall: true });
  $("to-pick").onclick = () => showPick(true);
  $("back").onclick = () => show("recover");

  api.onStatus((message) => { $("status").textContent = message; });

  (async () => {
    state = await api.state();
    const target = state.target;
    if (state.view === "splash") {
      show("splash");
      $("splash-target").textContent = target ? `正在启动 ${target.label}` : "";
      $("status").textContent = state.status || "准备中…";
    } else if (state.view === "recover" && target) {
      show("recover");
      $("recover-target").textContent = `${target.label}${target.detail && target.detail !== target.label ? ` · ${target.detail}` : ""}`;
      $("recover-error").textContent = state.error || "连接已断开";
      // Reinstalling means rebuilding from the checkout in a development shell; a plain address cannot be reinstalled.
      $("reinstall").hidden = target.kind === "url";
      $("reinstall").textContent = state.dev ? "用当前代码重新构建" : "重新安装服务端";
    } else {
      showPick(false);
    }
  })();
</script>
</body>
</html>
