<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Nextflow Studio</title>
<style>
  :root {
    --bg: #eef2f8; --panel: #ffffffcc; --border: #d9e0ec; --text: #172033; --muted: #5d6880;
    --primary: #2f6fed; --primary-text: #fff; --danger: #c93838; --field: #fff; --hover: #f1f4fa;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1020; --panel: #141b2ecc; --border: #26304a; --text: #e6eaf3; --muted: #93a0bb;
      --primary: #4b83f5; --primary-text: #fff; --danger: #f07070; --field: #0f1527; --hover: #1b2440;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { width: min(560px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--primary); color: var(--primary-text); font: 700 15px ui-monospace, monospace; }
  h1 { margin: 0; font-size: 18px; }
  h2 { margin: 20px 0 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  li { display: flex; align-items: center; gap: 8px; border-radius: 10px; padding: 8px 10px; }
  li:hover { background: var(--hover); }
  li .name { flex: 1; min-width: 0; }
  li .name span { display: block; color: var(--muted); font: 12px ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--border); background: var(--field); color: var(--text); padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--primary); }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 8px; }
  .tabs { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; width: fit-content; margin-bottom: 12px; }
  .tabs button { border: 0; background: transparent; padding: 4px 12px; }
  .tabs button[aria-selected="true"] { background: var(--hover); font-weight: 600; }
  form { display: grid; gap: 10px; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select { font: 13px ui-monospace, monospace; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--field); color: var(--text); width: 100%; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 96px; gap: 10px; }
  .actions { display: flex; justify-content: flex-end; margin-top: 4px; }
  #status { min-height: 20px; margin: 16px 0 0; font-size: 13px; color: var(--muted); }
  #status.error { color: var(--danger); white-space: pre-wrap; }
  .inline { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .inline span { flex: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header><div class="logo" aria-hidden="true">nf</div><h1>连接后端</h1></header>

  <section id="saved-section" hidden>
    <h2>最近</h2>
    <ul id="saved" aria-label="最近的连接"></ul>
  </section>

  <section>
    <h2>新建</h2>
    <div class="tabs" role="tablist" id="tabs"></div>
    <form id="form" autocomplete="off">
      <div data-kind="local"></div>
      <div data-kind="wsl">
        <label id="distro-field">发行版<select name="distro" required></select></label>
        <div id="wsl-missing" class="inline" hidden>
          <span>没有可用的 WSL 发行版</span>
          <button type="button" id="install-wsl">安装 WSL</button>
          <button type="button" id="refresh-wsl" class="ghost">刷新</button>
        </div>
      </div>
      <div data-kind="ssh">
        <div class="row">
          <label>目标<input name="target" placeholder="user@server 或 ~/.ssh/config 别名" required></label>
          <label>端口<input name="port" inputmode="numeric" placeholder="22"></label>
        </div>
        <label>私钥（可选）<input name="identityFile" placeholder="~/.ssh/id_ed25519"></label>
      </div>
      <div data-kind="url">
        <label>地址<input name="url" placeholder="http://127.0.0.1:8765" required></label>
        <label>令牌<input name="token" type="password" required></label>
      </div>
      <div class="actions"><button class="primary" type="submit" id="submit">连接</button></div>
    </form>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
  const api = window.studioConnect;
  const KINDS = { local: "本机", wsl: "WSL", ssh: "SSH", url: "地址" };
  const DETAIL = { local: () => "本机", wsl: (c) => `WSL · ${c.distro}`, ssh: (c) => `ssh ${c.target}${c.port ? `:${c.port}` : ""}`, url: (c) => c.url };
  const $ = (id) => document.getElementById(id);
  const form = $("form");
  let kind = "local";
  let busy = false;

  function setStatus(message, error = false) {
    $("status").textContent = message;
    $("status").className = error ? "error" : "";
  }

  function setBusy(next) {
    busy = next;
    for (const button of document.querySelectorAll("button")) button.disabled = next;
    for (const field of form.elements) field.disabled = next;
  }

  function showKind(next) {
    kind = next;
    for (const tab of $("tabs").children) tab.setAttribute("aria-selected", String(tab.dataset.kind === next));
    for (const part of form.querySelectorAll("[data-kind]")) {
      part.hidden = part.dataset.kind !== next;
      for (const field of part.querySelectorAll("input, select")) field.disabled = part.hidden;
    }
    $("submit").hidden = false;
    if (next === "wsl") loadDistros();
  }

  async function loadDistros(force = false) {
    const select = form.elements.distro;
    if (select.options.length && !force) return;
    select.replaceChildren();
    const distros = await api.distros();
    for (const name of distros) select.add(new Option(name, name));
    $("wsl-missing").hidden = distros.length > 0;
    $("distro-field").hidden = distros.length === 0;
    $("submit").hidden = kind === "wsl" && distros.length === 0;
  }

  $("refresh-wsl").onclick = async () => { setStatus(""); await loadDistros(true); };
  $("install-wsl").onclick = async () => {
    setBusy(true);
    setStatus("正在安装 WSL…");
    const result = await api.installWsl();
    setBusy(false);
    setStatus(result.ok ? "按安装窗口的提示创建 Linux 用户。需要重启时，重启后再打开应用。" : result.error, !result.ok);
    if (result.ok) await loadDistros(true);
  };

  async function connect(connection, token) {
    if (busy) return;
    setBusy(true);
    setStatus("正在连接…");
    const result = await api.connect(connection, token);
    if (!result.ok) { setBusy(false); setStatus(result.error, true); render(await api.state()); }
  }

  function render(state) {
    const list = $("saved");
    list.replaceChildren();
    $("saved-section").hidden = state.connections.length === 0;
    for (const connection of state.connections) {
      const item = document.createElement("li");
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = connection.label;
      const detail = DETAIL[connection.kind](connection);
      if (detail !== connection.label) {
        const line = document.createElement("span");
        line.textContent = detail;
        name.append(line);
      }
      const open = document.createElement("button");
      open.textContent = "连接";
      open.onclick = () => connect(connection);
      const remove = document.createElement("button");
      remove.className = "ghost";
      remove.textContent = "移除";
      remove.setAttribute("aria-label", `移除 ${connection.label}`);
      remove.onclick = async () => render(await api.remove(connection.id));
      item.append(name, open, remove);
      list.append(item);
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    const id = `${kind}-${Date.now().toString(36)}`;
    const connection = { id, kind, ...data };
    delete connection.token;
    connect(connection, kind === "url" ? data.token : undefined);
  });

  api.onStatus((message) => setStatus(message));

  (async () => {
    const state = await api.state();
    const kinds = Object.keys(KINDS).filter((k) => k !== "local" || state.localAvailable).filter((k) => k !== "wsl" || state.platform === "win32");
    for (const k of kinds) {
      const tab = document.createElement("button");
      tab.type = "button";
      tab.role = "tab";
      tab.dataset.kind = k;
      tab.textContent = KINDS[k];
      tab.onclick = () => showKind(k);
      $("tabs").append(tab);
    }
    render(state);
    showKind(kinds[0]);
    if (state.error) setStatus(state.error, true);
    const auto = state.connections.find((c) => c.id === state.auto);
    if (auto) connect(auto);
  })();
</script>
</body>
</html>
