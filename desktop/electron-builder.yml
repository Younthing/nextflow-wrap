# Desktop packaging. Unsigned beta builds work without any secrets:
#   pnpm --dir desktop install --ignore-workspace && pnpm --dir desktop dist
# Signed and notarized macOS builds read these from the environment (see .github/workflows/desktop.yml):
#   CSC_LINK, CSC_KEY_PASSWORD           Developer ID Application certificate (.p12, base64)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   notarization
appId: io.nextflowstudio.desktop
productName: Nextflow Studio
artifactName: Nextflow-Studio-${version}-${os}-${arch}.${ext}
copyright: Copyright © 2026 Nextflow Studio
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  # Linux server packages that the WSL and SSH backends install on the target (scripts/build-server.mjs).
  - from: resources/server
    to: server
  - from: build/trayTemplate.png
    to: trayTemplate.png
asar: true
mac:
  category: public.app-category.developer-tools
  extraResources:
    # The bundled local server. The standalone server ships as an archive: electron-builder drops node_modules
    # folders from extra resources.
    - from: resources/app-server.tar.gz
      to: app-server.tar.gz
    - from: resources/app-server.build
      to: app-server.build
    - from: resources/runner
      to: runner
    - from: resources/plugins
      to: plugins
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarizes when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are set; skipped otherwise.
  notarize: true
linux:
  category: Science
  extraResources:
    # The bundled local server. The standalone server ships as an archive: electron-builder drops node_modules
    # folders from extra resources.
    - from: resources/app-server.tar.gz
      to: app-server.tar.gz
    - from: resources/app-server.build
      to: app-server.build
    - from: resources/runner
      to: runner
    - from: resources/plugins
      to: plugins
  target:
    - target: AppImage
      arch: [x64]
  maintainer: Nextflow Studio
# Windows has no local server (Nextflow does not run on Windows): the app connects to WSL or a remote machine.
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
dmg:
  sign: false
publish:
  provider: github
  owner: Younthing
  repo: nextflow-wrap
  releaseType: release
